version: '3.8'

services:
  web:
    restart: always
    build: .
    working_dir: /app
    ports:
      - "8888:5000"
    volumes:
      - .:/app
      - ./static:/app/static
      - ./templates:/app/templates
      - ./img:/app/img
    env_file:
      - .env
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sports_network

  db:
    restart: always
    image: postgres:16.2
    volumes:
      - postgres_data:/var/lib/postgresql/data

      # COMMENTED OUT: default schema setup (not needed for dump-only test)
      # - ./0-schema.sql:/docker-entrypoint-initdb.d/0-schema.sql
      # - ./1-init-admin.sh:/docker-entrypoint-initdb.d/1-init-admin.sh
      # - ./2-seed-test-data.sql:/docker-entrypoint-initdb.d/2-seed-test-data.sql

      # Mount the dump file and restore script
      - ./pool_league.dump:/docker-entrypoint-initdb.d/pool_league.dump
      - ./3-restore-dump.sh:/docker-entrypoint-initdb.d/3-restore-dump.sh

    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - sports_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  sports_network:
    driver: bridge

